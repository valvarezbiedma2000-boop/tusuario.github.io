    }

      overflow: hidden;
    }

    .titulo {
      padding: 17px 18px;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 15px;
    }

    .titulo:hover {
      background: #f0f0f0;
    }

    .flecha {
      font-size: 18px;
      color: #777;
      flex-shrink: 0;
    }

    .codigo {
      font-weight: bold;
    }

    .descripcion {
      font-weight: normal;
    }

    .contenido {
      display: none;
      padding: 0 18px 20px 18px;
      border-top: 1px solid #eee;
      line-height: 1.5;
    }

    .etiqueta {
      display: inline-block;
      margin-top: 15px;
      margin-bottom: 15px;
      padding: 5px 10px;
      background: #eee;
      border-radius: 5px;
      font-size: 12px;
      font-weight: bold;
    }

    .campo {
      margin-bottom: 15px;
    }

    .campo-titulo {
      font-weight: bold;
      margin-bottom: 5px;
    }

    .actuacion {
      margin: 0;
    }

    .sin-resultados {
      display: none;
      margin-top: 20px;
      padding: 20px;
      background: white;
      border: 1px solid #ddd;
      border-radius: 8px;
      text-align: center;
      color: #666;
    }

    .limpiar {
      margin-top: 10px;
      padding: 8px 14px;
      border: 1px solid #ccc;
      border-radius: 6px;
      background: white;
      cursor: pointer;
    }

    .limpiar:hover {
      background: #eee;
    }

</head>

  /*
   * ============================================================
   * NORMALIZAR TEXTO
   * Permite buscar con o sin tildes.
   * ============================================================
   */

  function normalizarTexto(texto) {

    return texto
      .toString()
      .toLowerCase()
      .normalize("NFD")
      .replace(/[\u0300-\u036f]/g, "");

  }


  /*
   * ============================================================
   * MOSTRAR ALARMAS
   * ============================================================
   */

  function mostrarAlarmas(lista) {

    const contenedor =
      document.getElementById("listaAlarmas");

    contenedor.innerHTML = "";

    lista.forEach(function(alarma, indice) {

      const elemento =
        document.createElement("div");

      elemento.className = "alarma";

      let causaHTML = "";

      if (alarma.causa) {

        causaHTML =
          '<div class="campo">' +
            '<div class="campo-titulo">Posible causa</div>' +
            '<div>' + alarma.causa + '</div>' +
          '</div>';

      }

      elemento.innerHTML =

        '<div class="titulo" onclick="mostrarExplicacion(' +
        indice +
        ')">' +

          '<span>' +
            '<span class="codigo">' +
              alarma.codigo +
            '</span>' +

            ' — ' +

            '<span class="descripcion">' +
              alarma.descripcion +
            '</span>' +
          '</span>' +

          '<span id="flecha-' +
            indice +
          '" class="flecha">▼</span>' +

        '</div>' +

        '<div id="contenido-' +
        indice +
        '" class="contenido">' +

          '<span class="etiqueta">' +
            alarma.tipo +
          '</span>' +

          causaHTML +

          '<div class="campo">' +
            '<div class="campo-titulo">Actuación del operario</div>' +
            '<div class="actuacion">' +
              alarma.actuacion +
            '</div>' +
          '</div>' +

        '</div>';

      contenedor.appendChild(elemento);

    });

  }


  /*
   * ============================================================
   * ABRIR / CERRAR ALARMA
   * ============================================================
   */

  function mostrarExplicacion(indice) {

    const contenido =
      document.getElementById("contenido-" + indice);

    const flecha =
      document.getElementById("flecha-" + indice);

    if (contenido.style.display === "block") {

      contenido.style.display = "none";

      flecha.textContent = "▼";

    } else {

      contenido.style.display = "block";

      flecha.textContent = "▲";

    }

  }


  /*
   * ============================================================
   * BUSCADOR
   * ============================================================
   */

  function buscarAlarmas() {

    const texto =
      normalizarTexto(
        document
          .getElementById("buscador")
          .value
          .trim()
      );

    let resultados;

    if (texto === "") {

      resultados = alarmas;

    } else {

      resultados =
        alarmas.filter(function(alarma) {

          const codigo =
            normalizarTexto(alarma.codigo);

          const descripcion =
            normalizarTexto(alarma.descripcion);

          const actuacion =
            normalizarTexto(alarma.actuacion);

          const causa =
            normalizarTexto(alarma.causa || "");

          const tipo =
            normalizarTexto(alarma.tipo);

          return (

            codigo.includes(texto) ||

            descripcion.includes(texto) ||

            actuacion.includes(texto) ||

            causa.includes(texto) ||

            tipo.includes(texto)

          );

        });

    }

    mostrarAlarmas(resultados);

    const mensaje =
      document.getElementById("sinResultados");

    const informacion =
      document.getElementById("resultadoInfo");

    if (resultados.length === 0) {

      mensaje.style.display = "block";

      informacion.textContent = "";

    } else {

      mensaje.style.display = "none";

      informacion.textContent =
        resultados.length +
        (
          resultados.length === 1
          ? " resultado encontrado"
          : " resultados encontrados"
        );

    }

  }


  /*
   * ============================================================
   * INICIO
   * ============================================================
   */

  mostrarAlarmas(alarmas);

  document.getElementById("resultadoInfo").textContent =
    alarmas.length + " alarmas e incidencias disponibles";


</script>
